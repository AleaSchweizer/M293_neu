<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navigation">
    <a class="nav-link" href="index.html">Über mich</a>
    <a class="nav-link" href="skills.html">Fähigkeiten</a>
    <a class="nav-link" href="portfolio.html">Portfolio</a>
    <a class="nav-link" href="contact.html">Kontakt</a>
</nav>

<section id="kontakt" class="kontakt-section">
    <div class="kontakt-container">

        <!-- Linke Seite -->
        <div class="kontakt-info">
            <h2>Kontaktinformationen</h2>

            <div class="kontakt-item">
                <div class="icon-circle">
                    <img src="email.png" alt="E-Mail Icon">
                </div>
                <span>alea.schweizer@edu.gbssg.ch</span>
            </div>

            <div class="kontakt-item">
                <div class="icon-circle">
                    <img src="telephone.png" alt="Telefon Icon">
                </div>
                <span>077 470 89 88</span>
            </div>

            <div class="kontakt-item">
                <div class="icon-circle">
                    <img src="location.png" alt="Standort Icon">
                </div>
                <span>Schwarzenbach 2178, Gossau</span>
            </div>

            <div class="kontakt-item">
                <div class="icon-circle">
                    <img src="instagram.png" alt="Instagram Icon">
                </div>
                <span>alea.schweizer</span>
            </div>

        </div>

        <!-- Rechte Seite -->
        <div class="kontakt-formular">
            <h2>Kontaktformular</h2>

            <form>
                <input type="text" placeholder="Name:" required>
                <input type="email" placeholder="E-Mail:" required>

                <textarea class="nachricht" placeholder="Nachricht:" rows="6"></textarea>

                <button type="submit">Senden</button>
            </form>
        </div>

    </div>

    <div class="linie"></div>
</section>

</body>
</html>
